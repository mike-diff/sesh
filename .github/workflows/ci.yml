name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          # Nothing to cache: sesh has no dependencies, so there is no go.sum
          # for the module cache to key on. Left on, every run attempts and
          # fails a restore, and the warning trains you to skim annotations.
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      # The end-to-end rig: the built binary, headless, against a scripted
      # endpoint. Catches assembled-product regressions unit tests cannot
      # (wire shape, gates, drive lifecycle, session persistence).
      - name: e2e
        env:
          SESH_E2E: "1"
        run: go test ./harness/ -run TestE2E -count=1 -v
